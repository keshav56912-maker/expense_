<div class="container mt-5">

    <h1 class="text-center mb-4">
        Expense Tracker
    </h1>

    <div class="card p-4">

        <h3 class="mb-4">
            Add Expense
        </h3>

        <form id="expenseForm">

            <div class="mb-3">
                <label for="expenseName" class="form-label">
                    Expense Name
                </label>

                <input
                    type="text"
                    id="expenseName"
                    class="form-control"
                    placeholder="Enter expense name"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="amount" class="form-label">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    class="form-control"
                    placeholder="Enter amount"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">
                    Category
                </label>

                <select id="category" class="form-select" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    class="form-control"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Expense
            </button>

        </form>

    </div>

</div>
