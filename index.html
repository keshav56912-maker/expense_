<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Expense Tracker
        </h1>

        <!-- Add Expense Form -->
        <div class="card p-4">

            <h3 class="mb-4">
                Add Expense
            </h3>

            <form id="expenseForm">

                <div class="mb-3">
                    <label for="expenseName" class="form-label">
                        Expense Name
                    </label>

                    <input
                        type="text"
                        id="expenseName"
                        class="form-control"
                        placeholder="Enter expense name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="amount" class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        class="form-control"
                        placeholder="Enter amount"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">
                        Category
                    </label>

                    <select id="category" class="form-select" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        class="form-control"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="submitBtn"
                >
                    Add Expense
                </button>

            </form>

        </div>


        <!-- Expense List -->
        <div class="card p-4 mt-4">

            <h3 class="mb-3">
                Total: ₹<span id="totalAmount">0</span>
            </h3>

            <div id="expenseList"></div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
